name: 爬蟲 - 加州天天樂

on:
  schedule:
    # 一天觸發一次即可：程式內部會自己重試最長 330 分鐘（見 lottery_scraper.py
    # 的 LOOP_MAX_MINUTES），不再需要每小時觸發、也不再需要停用/重新啟用機制。
    # 台灣時間 11:05 觸發，換算 UTC 是 3:05。
    - cron: "5 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: lottery-scraper-fantasy5
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: run
        env:
          GITHUB_REPO: redwinds542688-gif/Lottery-database
          GITHUB_TOKEN: ${{ secrets.DATA_TOKEN }}
          GITHUB_BRANCH: main
          STATE_DIR: state
        run: python lottery_scraper.py --game fantasy5

      - name: 提交狀態檔案（lottery.db / status.json / source_health.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新爬蟲狀態 (加州天天樂) [skip ci]"
          git pull --rebase origin main
          git push
